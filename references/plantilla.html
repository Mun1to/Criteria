<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITULO__</title>
<style>
  /* ===================================================================
     PALETA, lo único que se toca al adaptar esto al proyecto donde se usa.
     Por defecto lleva una paleta neutra por tema, medida por contraste
     WCAG 2.1. Si el proyecto activo tiene su propio sistema de tokens
     (variables de color, radios, tipo de letra), esos valores se
     sustituyen aquí por los suyos; si un hex se toca a mano, se vuelve a
     medir el contraste, no se ajusta mirando. El resto del CSS de abajo
     (ESTRUCTURA) usa siempre var(--algo) y no hay que tocarlo para que el
     cambio de piel se refleje solo.
     =================================================================== */
  :root {
    font-family: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, -apple-system, Roboto, sans-serif;
    --letra-titulos: "Segoe UI Variable Display", "Segoe UI", Inter, system-ui, -apple-system, Roboto, sans-serif;
    font-size: 17px;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    --radio: 12px;
    --panel: color-mix(in srgb, var(--bg) 100%, var(--vuelta) 4%);
    --line: color-mix(in srgb, var(--bg) 100%, var(--vuelta) 13%);
    --hueco: color-mix(in srgb, var(--bg) 100%, var(--hundir) 40%);
    --boton-suave: color-mix(in srgb, var(--accent) 24%, var(--bg));
  }
  :root {
    color-scheme: light;
    --vuelta: #000000; --hundir: #ffffff;
    --bg: #f4f5f7; --text: #1a1d21; --text-dim: #33383f; --muted: #5c636d; --faint: #858c96;
    --accent: #1f6fc0; --accent-text: #1f6fc0; --sobre: #ffffff; --ok: #137a52; --warn: #9c6b0f; --bad: #c33a2c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --vuelta: #ffffff; --hundir: #000000;
      --bg: #17191c; --text: #e8eaed; --text-dim: #c5cbd3; --muted: #a3aab4; --faint: #8a919b;
      --accent: #2f6fb8; --accent-text: #8fbaf0; --sobre: #ffffff; --ok: #35b37e; --warn: #d7a13a; --bad: #ef7a6d;
    }
  }
  /* =================== ESTRUCTURA, no se toca al adaptar =============== */
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); }
  h1, h2, .cr-palabra { font-family: var(--letra-titulos); }
  .cr-wrap { max-width: 1040px; min-height: 100svh; margin: 0 auto; padding: 24px 16px 140px; }
  .cr-head h1 { font-size: 28px; font-weight: 800; line-height: 1.2; margin: 0 0 6px; }
  .cr-sub { color: var(--muted); margin: 0 0 4px; }
  .cr-meta { color: var(--muted); font-size: 15px; margin: 0 0 26px; }

  /* Arriba y siempre a la vista: cuántas van respondidas. */
  .cr-progreso-top { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
  .cr-progreso-inner { max-width: 1040px; margin: 0 auto; padding: 14px 16px 12px; display: flex; align-items: center; gap: 14px; }
  .cr-progreso-track { flex: 1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
  .cr-progreso-fill { height: 100%; width: 0%; background: var(--accent-text); transition: width .25s ease; }
  .cr-progreso-texto { font-size: 15px; color: var(--muted); white-space: nowrap; }
  .cr-progreso-texto b { color: var(--text); }

  /* Una pregunta cada vez. */
  .cr-seccion { color: var(--accent-text); font-weight: 700; margin: 0 0 4px; }
  .cr-cuenta { color: var(--muted); font-weight: 600; margin: 0 0 6px; }
  .cr-pregunta { font-size: 25px; font-weight: 800; line-height: 1.25; margin: 0 0 6px; }
  .cr-pregunta.cr-falta { color: var(--bad); }
  .cr-ayuda { color: var(--muted); margin: 0 0 4px; }
  .cr-pista { color: var(--muted); margin: 4px 0 0; }
  .cr-sino { color: var(--muted); font-size: 16px; margin: 12px 0 0; }

  /* Las respuestas para elegir: la palabra grande, la frase debajo, su marca al tocarla. */
  .cr-baldosas { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin: 16px 0 14px; }
  .cr-baldosas.n2, .cr-baldosas.n4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .cr-baldosa { position: relative; display: flex; flex-direction: column; align-items: flex-start; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer;
    background: var(--panel); border: 2px solid var(--line); border-radius: var(--radio); padding: 14px 46px 14px 16px; transition: background .15s, border-color .15s; }
  @media (hover: hover) { .cr-baldosa:hover { border-color: var(--accent-text); } }
  .cr-baldosa svg { width: 24px; height: 24px; color: var(--accent-text); display: block; margin-bottom: 8px; }
  .cr-palabra { display: block; font-size: 19px; font-weight: 800; line-height: 1.25; }
  .cr-palabra.cr-larga { font-size: 17px; font-weight: 600; line-height: 1.4; }
  .cr-frase { display: block; color: var(--muted); font-size: 16px; line-height: 1.45; margin-top: 4px; }
  .cr-rec { display: block; color: var(--accent-text); font-weight: 700; font-size: 15px; margin-top: 8px; }
  .cr-baldosa::after { content: ""; position: absolute; right: 14px; top: 14px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); }
  .cr-varias .cr-baldosa::after { border-radius: 5px; }
  .cr-baldosa[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--sobre); }
  .cr-baldosa[aria-pressed="true"] svg, .cr-baldosa[aria-pressed="true"] .cr-frase, .cr-baldosa[aria-pressed="true"] .cr-rec { color: var(--sobre); }
  .cr-baldosa[aria-pressed="true"]::after { border-color: var(--sobre); background: radial-gradient(circle, var(--sobre) 0 5px, transparent 6px); }
  .cr-varias .cr-baldosa[aria-pressed="true"]::after { background: linear-gradient(var(--sobre), var(--sobre)) center / 10px 10px no-repeat; }

  /* Lo malo, lo bueno y lo que cuesta de la elegida, en una línea cada uno. */
  .cr-elegida { font-weight: 800; margin: 14px 0 4px; }
  .cr-porque { margin: 0 0 10px; }
  .cr-porque b { color: var(--accent-text); }
  .cr-ficha { display: grid; gap: 6px; margin: 4px 0 12px; }
  .cr-ficha div { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 10px; }
  .cr-ficha dt { font-weight: 700; }
  .cr-ficha dd { margin: 0; }
  .cr-ficha .cr-m dt { color: var(--bad); }
  .cr-ficha .cr-b dt { color: var(--ok); }

  input[type="text"], textarea.cr-campo, textarea.cr-otra {
    display: block; width: 100%; background: var(--hueco); color: var(--text); border: 2px solid var(--line);
    border-radius: 10px; padding: 11px 12px; font: inherit; font-size: 16px; resize: none; overflow: hidden; margin-top: 14px;
  }
  textarea.cr-otra { margin-top: 6px; min-height: 52px; }
  textarea.cr-campo { min-height: 110px; }
  ::placeholder { color: var(--muted); opacity: 1; }
  .cr-baldosa:focus-visible, .cr-boton:focus-visible, input:focus-visible, textarea:focus-visible { outline: 3px solid var(--accent-text); outline-offset: 2px; }

  .cr-escala { display: flex; flex-direction: column; gap: 6px; margin-top: 18px; }
  .cr-escala input[type="range"] { width: 100%; height: 32px; accent-color: var(--accent); }
  .cr-escala-fila { display: flex; justify-content: space-between; gap: 16px; font-size: 15px; color: var(--muted); }
  .cr-escala-valor { font-family: var(--letra-titulos); font-weight: 800; color: var(--text); font-size: 34px; line-height: 1; }

  .cr-boton { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 10px 22px; border-radius: 10px; border: 0; cursor: pointer; white-space: nowrap;
    font: 700 16px/1.2 var(--letra-titulos); background: var(--boton-suave); color: var(--text); }
  .cr-boton.cr-fuerte { background: var(--accent); color: var(--sobre); box-shadow: 0 10px 28px -14px var(--accent); }
  .cr-botones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 18px; }

  .cr-resumen { list-style: none; margin: 14px 0 18px; padding: 0; display: grid; gap: 16px; }
  .cr-resumen li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; }
  .cr-resumen b { display: block; }
  .cr-resumen .cr-vacia { color: var(--muted); }

  .cr-pie { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: color-mix(in srgb, var(--panel) 94%, transparent); border-top: 1px solid var(--line); backdrop-filter: blur(8px); padding: 12px 16px; }
  .cr-pie-inner { max-width: 1040px; margin: 0 auto; display: flex; justify-content: center; }

  .cr-resultado {
    position: fixed; left: 0; right: 0; bottom: 74px; z-index: 6; margin: 0 auto; width: min(720px, calc(100% - 32px));
    background: var(--panel); border: 2px solid var(--line); border-radius: var(--radio);
    padding: 14px 16px; box-shadow: 0 8px 28px rgba(0,0,0,.28);
  }
  .cr-resultado-head { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; flex-wrap: wrap; }
  .cr-resultado-head strong { color: var(--ok); flex: 1; min-width: 12em; }
  .cr-resultado-head .cr-boton { min-height: 40px; padding: 8px 14px; font-size: 15px; }
  #cr-texto {
    width: 100%; min-height: 150px; background: var(--hueco); color: var(--text-dim);
    border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px;
    font: 14px/1.5 ui-monospace, Consolas, monospace; resize: none;
  }
  @media (max-width: 860px) {
    .cr-baldosas, .cr-baldosas.n2, .cr-baldosas.n4 { grid-template-columns: minmax(0, 1fr); }
    .cr-head h1 { font-size: 24px; }
    .cr-pregunta { font-size: 22px; }
    .cr-ficha div { grid-template-columns: 92px minmax(0, 1fr); }
  }
</style>
</head>
<body>
<div class="cr-progreso-top">
  <div class="cr-progreso-inner">
    <div class="cr-progreso-track"><div class="cr-progreso-fill" id="cr-progreso-fill"></div></div>
    <div class="cr-progreso-texto"><b id="cr-contador">0</b> de <span id="cr-total">0</span> respondidas</div>
  </div>
</div>

<main class="cr-wrap">
  <header class="cr-head">
    <h1 id="cr-titulo"></h1>
    <p class="cr-sub" id="cr-subtitulo"></p>
    <p class="cr-meta">Una pregunta cada vez. Nada es obligatorio: contesta lo que sepas y copia el bloque al final.</p>
  </header>
  <div id="cr-vista"></div>
</main>

<div class="cr-resultado" id="cr-resultado" hidden>
  <div class="cr-resultado-head">
    <strong id="cr-estado">Bloque listo</strong>
    <button type="button" class="cr-boton" id="cr-copiar-otra-vez">Copiar de nuevo</button>
    <button type="button" class="cr-boton" id="cr-cerrar-resultado">Cerrar</button>
  </div>
  <textarea id="cr-texto" readonly aria-label="Tus respuestas"></textarea>
</div>

<footer class="cr-pie">
  <div class="cr-pie-inner"><button type="button" class="cr-boton" id="cr-boton">Copiar respuestas</button></div>
</footer>

<script>
// ---------------------------------------------------------------------
// Rellenar aquí: TITULO, SUBTITULO y PREGUNTAS. Es lo único que cambia
// entre un cuestionario y otro; el resto de este script no se toca.
// ---------------------------------------------------------------------
const TITULO = "__TITULO__";
const SUBTITULO = "__SUBTITULO__";
const PREGUNTAS = __PREGUNTAS_JSON__;
/*
Se ve una pregunta cada vez, con «Siguiente» para pasar, y al final lo que se
ha contestado con un solo «Copiar respuestas». Formas de pregunta admitidas.
En "opcion" y "multiple" el hueco «Otra» con texto libre va SIEMPRE solo, no
hace falta pedirlo, y "multiple" ya avisa de que se puede elegir más de una.
  { tipo: "texto",    pregunta, ayuda?, siNoDices? }
  { tipo: "parrafo",  pregunta, ayuda?, siNoDices? }
  { tipo: "opcion",   pregunta, ayuda?, siNoDices?, opciones: [..] }
  { tipo: "multiple", pregunta, ayuda?, siNoDices?, opciones: [..] }
  { tipo: "escala",   pregunta, ayuda?, siNoDices?, min?, max?, defecto?, etiquetaMin?, etiquetaMax? }
  ayuda: por qué se pregunta ahora, en una línea. siNoDices: qué pasa si no se contesta.

Cada elemento de "opciones" admite dos formas, mezclables en la misma lista:
  "Texto de la opción"
  { texto, ayuda?, recomendada?, porque?, malo?, bueno?, cuesta?, noHace?, icono?, nota? }
    texto: la palabra, grande (de una a tres palabras rinde mejor).
    ayuda: la frase de debajo, lo que pasa si se elige.
    recomendada: true en una sola; "porque" dice por qué. Nunca sale marcada de antemano.
    malo, bueno, cuesta: una línea cada uno; salen al pulsar la opción.
    noHace: lo que NO incluye, si se puede leer de dos maneras.
    icono: si, no, ya, esperar, pregunta, gente, dinero, texto, igual, estrella, lapiz, flecha o escudo.
    nota: una palabra o dos debajo, en el color de acento (p. ej. "la más barata").

Cualquier pregunta admite además "seccion" (opcional): un título de grupo, p. ej.
"La escalera de niveles". Sale encima de la pregunta con letra automática (A, B,
C...) en cuanto cambia de una pregunta a la siguiente. No cambia la numeración
P1, P2... de cada pregunta ni el formato del bloque de respuesta.
*/
// ---------------------------------------------------------------------

const CLAVE = "criteria:" + location.pathname;
const N = PREGUNTAS.length;
const LETRAS = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
const IC = {
  si: '<polyline points="4 12.5 9.5 18 20 6.5"/>',
  no: '<path d="M6 6l12 12M18 6L6 18"/>',
  ya: '<path d="M7 4.5v15l12-7.5z"/>',
  esperar: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/>',
  pregunta: '<circle cx="12" cy="12" r="9"/><path d="M9.6 9.4a2.5 2.5 0 1 1 3.4 2.4c-.7.3-1 .8-1 1.5v.7"/><path d="M12 17h.01"/>',
  gente: '<circle cx="9" cy="8" r="3.5"/><path d="M3 20c.4-3.4 2.9-5.5 6-5.5s5.6 2.1 6 5.5"/><path d="M15.5 4.8a3.5 3.5 0 0 1 0 6.4M17.5 14.8c2 .7 3.2 2.5 3.5 5.2"/>',
  dinero: '<circle cx="12" cy="12" r="9"/><path d="M15 8.6a4 4 0 1 0 0 6.8M7.5 10.6h5.5M7.5 13.4h5.5"/>',
  texto: '<path d="M5 6h14M12 6v13M9 19h6"/>',
  igual: '<path d="M5 9h14M5 15h14"/>',
  estrella: '<path d="M12 3.5l2.6 5.6 6 .7-4.5 4.1 1.2 6-5.3-3-5.3 3 1.2-6-4.5-4.1 6-.7z"/>',
  lapiz: '<path d="M4 20l1-4.5L16 4.5l3.5 3.5L8.5 19z"/><path d="M13.5 7l3.5 3.5"/>',
  flecha: '<path d="M4 12h15M13 6l6 6-6 6"/>',
  escudo: '<path d="M12 3l8 3v6c0 4.6-3.3 7.9-8 9-4.7-1.1-8-4.4-8-9V6z"/>'
};
const icono = (n) => IC[n] ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + IC[n] + '</svg>' : "";
const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const $ = (id) => document.getElementById(id);
const opcionesDe = (p) => (p.opciones || []).map((o) => typeof o === "string" ? { texto: o } : o);
const esOtra = (v) => v === "Otra" || String(v).startsWith("Otra: ");

document.title = TITULO;
$("cr-titulo").textContent = TITULO;
$("cr-subtitulo").textContent = SUBTITULO;
$("cr-total").textContent = N;

function cargarGuardado() {
  try { return JSON.parse(localStorage.getItem(CLAVE) || "{}") || {}; } catch { return {}; }
}
function guardar(id, valor) {
  const g = cargarGuardado();
  g[id] = valor;
  try { localStorage.setItem(CLAVE, JSON.stringify(g)); } catch {}
  actualizarContador();
}
let paso = 0;
try { paso = Math.max(0, Math.min(N, parseInt(localStorage.getItem(CLAVE + ":paso") || "0", 10) || 0)); } catch {}
function irA(n) {
  paso = Math.max(0, Math.min(N, n));
  try { localStorage.setItem(CLAVE + ":paso", String(paso)); } catch {}
  pintar();
  window.scrollTo({ top: 0, behavior: "smooth" });
}

// La letra de cada sección, contada en el orden en que aparecen.
const seccionDe = [];
(() => { let actual = null, k = -1; PREGUNTAS.forEach((p, i) => { if (p.seccion && p.seccion !== actual) { actual = p.seccion; k++; } seccionDe[i] = p.seccion ? (LETRAS[k] || String(k + 1)) + " · " + p.seccion : ""; }); })();

function respondida(i) {
  const v = cargarGuardado()["p" + i];
  return v != null && String(Array.isArray(v) ? v.join(",") : v).trim().length > 0;
}
// Lo que se copia de una opción lleva su número, para poder decir «P2, la 3».
function conNumero(p, v) {
  if (esOtra(v)) return v;
  const j = opcionesDe(p).findIndex((o) => o.texto === v);
  return j >= 0 ? (j + 1) + " · " + v : v;
}
function respuestaTexto(i) {
  const p = PREGUNTAS[i], v = cargarGuardado()["p" + i];
  if (v == null || (Array.isArray(v) && v.length === 0) || String(v).trim() === "") return "";
  if (Array.isArray(v)) return v.map((x) => conNumero(p, x)).join(", ");
  return String(v);
}

function ficha(o, j, conNombre) {
  let h = "";
  if (o.malo) h += '<div class="cr-m"><dt>Lo malo</dt><dd>' + esc(o.malo) + '</dd></div>';
  if (o.bueno) h += '<div class="cr-b"><dt>Lo bueno</dt><dd>' + esc(o.bueno) + '</dd></div>';
  if (o.cuesta) h += '<div><dt>Te cuesta</dt><dd>' + esc(o.cuesta) + '</dd></div>';
  if (o.noHace) h += '<div><dt>No hace</dt><dd>' + esc(String(o.noHace).charAt(0).toUpperCase() + String(o.noHace).slice(1)) + '</dd></div>';
  return (conNombre && (h || o.porque) ? '<p class="cr-elegida">' + (j + 1) + ' · ' + esc(o.texto) + '</p>' : '') +
    (o.recomendada && o.porque ? '<p class="cr-porque"><b>Por qué te la recomiendo:</b> ' + esc(o.porque) + '</p>' : '') +
    (h ? '<dl class="cr-ficha">' + h + '</dl>' : '');
}

function pintarPregunta(i) {
  const p = PREGUNTAS[i], id = "p" + i, g = cargarGuardado(), prev = g[id];
  let h = "";
  if (seccionDe[i]) h += '<p class="cr-seccion">' + esc(seccionDe[i]) + '</p>';
  h += '<p class="cr-cuenta">Pregunta ' + (i + 1) + ' de ' + N + '</p>';
  h += p.pregunta && String(p.pregunta).trim()
    ? '<h2 class="cr-pregunta">' + esc(p.pregunta) + '</h2>'
    : '<h2 class="cr-pregunta cr-falta">Falta el texto de esta pregunta (campo "pregunta" vacío o ausente)</h2>';
  if (p.ayuda) h += '<p class="cr-ayuda">' + esc(p.ayuda) + '</p>';

  if (p.tipo === "texto") {
    h += '<input type="text" class="cr-campo" id="cr-campo" aria-label="Tu respuesta" value="' + esc(prev || "") + '">';
  } else if (p.tipo === "parrafo") {
    h += '<textarea class="cr-campo" id="cr-campo" rows="3" aria-label="Tu respuesta">' + esc(prev || "") + '</textarea>';
  } else if (p.tipo === "opcion" || p.tipo === "multiple") {
    const ops = opcionesDe(p), marcadas = Array.isArray(prev) ? prev : [];
    const otra = marcadas.find((v) => String(v).startsWith("Otra: "));
    if (p.tipo === "multiple") h += '<p class="cr-pista">Elige una o varias.</p>';
    h += '<div class="cr-baldosas n' + ops.length + (p.tipo === "multiple" ? " cr-varias" : "") + '" role="group" aria-label="Opciones">';
    ops.forEach((o, j) => {
      const larga = !o.ayuda && String(o.texto).length > 32;
      h += '<button type="button" class="cr-baldosa" data-j="' + j + '" aria-pressed="' + (marcadas.indexOf(o.texto) >= 0) + '">' + icono(o.icono) +
        '<span class="cr-palabra' + (larga ? " cr-larga" : "") + '">' + (j + 1) + ' · ' + esc(o.texto) + '</span>' +
        (o.ayuda ? '<span class="cr-frase">' + esc(o.ayuda) + '</span>' : '') +
        (o.recomendada ? '<span class="cr-rec">Te la recomiendo</span>' : '') +
        (o.nota ? '<span class="cr-rec">' + esc(o.nota) + '</span>' : '') + '</button>';
    });
    h += '</div>';
    const elegidas = ops.map((o, j) => [o, j]).filter(([o]) => marcadas.indexOf(o.texto) >= 0);
    elegidas.forEach(([o, j]) => { h += ficha(o, j, elegidas.length > 1); });
    if (!elegidas.length && ops.some((o) => o.malo || o.bueno || o.cuesta)) h += '<p class="cr-pista">Pulsa una para ver lo malo, lo bueno y lo que te cuesta.</p>';
    h += '<textarea class="cr-otra" id="cr-otra" rows="1" placeholder="Otra: con tus palabras" aria-label="Otra, con tus palabras">' + esc(otra ? otra.slice(6) : "") + '</textarea>';
  } else if (p.tipo === "escala") {
    const min = p.min ?? 0, max = p.max ?? 10, def = p.defecto ?? Math.round((min + max) / 2);
    const v = prev != null ? prev : def;
    if (prev == null) guardar(id, String(v));
    h += '<div class="cr-escala"><div class="cr-escala-valor" id="cr-escala-valor">' + esc(v) + '</div>' +
      '<input type="range" id="cr-rango" min="' + esc(min) + '" max="' + esc(max) + '" value="' + esc(v) + '" aria-label="Puntuación">' +
      '<div class="cr-escala-fila"><span>' + esc(p.etiquetaMin || min) + '</span><span>' + esc(p.etiquetaMax || max) + '</span></div></div>';
  }
  if (p.siNoDices) h += '<p class="cr-sino">' + esc(p.siNoDices) + '</p>';
  h += '<div class="cr-botones">' + (i ? '<button type="button" class="cr-boton" data-paso="-1">Atrás</button>' : '') +
    '<button type="button" class="cr-boton' + (respondida(i) ? " cr-fuerte" : "") + '" id="cr-siguiente" data-paso="1">' + (i === N - 1 ? "Ver lo que has contestado" : "Siguiente") + '</button></div>';
  return h;
}

function pintarResumen() {
  let h = '<h2 class="cr-pregunta">Lo que has contestado</h2><ol class="cr-resumen">';
  PREGUNTAS.forEach((p, i) => {
    const r = respuestaTexto(i);
    h += '<li><div><b>P' + (i + 1) + '. ' + esc(p.pregunta) + '</b>' + (r ? esc(r) : '<span class="cr-vacia">Sin responder</span>') +
      '</div><button type="button" class="cr-boton" data-ir="' + i + '">Cambiar</button></li>';
  });
  return h + '</ol><p class="cr-pista">Pulsa «Copiar respuestas» y pega el bloque en el chat.</p>';
}

const vista = $("cr-vista");
function crece(ta) { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + 4 + "px"; }
function pintar() {
  vista.innerHTML = paso < N ? pintarPregunta(paso) : pintarResumen();
  vista.querySelectorAll("textarea").forEach(crece);
  actualizarContador();
}

function actualizarContador() {
  let n = 0;
  for (let i = 0; i < N; i++) if (respondida(i)) n++;
  $("cr-contador").textContent = n;
  $("cr-progreso-fill").style.width = (N ? Math.round((n / N) * 100) : 0) + "%";
  // Una acción principal por pantalla: «Copiar» manda cuando ya no queda nada por pasar.
  $("cr-boton").className = "cr-boton" + (paso >= N || n === N ? " cr-fuerte" : "");
  const sig = $("cr-siguiente");
  if (sig && paso < N) sig.className = "cr-boton" + (respondida(paso) ? " cr-fuerte" : "");
}

// Guarda lo elegido de una pregunta de opción: las opciones marcadas y, si hay, lo escrito en «Otra».
function guardarOpcion(i, marcadas, otraTxt) {
  const v = marcadas.slice();
  if (otraTxt && otraTxt.trim()) v.push("Otra: " + otraTxt.trim());
  guardar("p" + i, v);
}
vista.addEventListener("click", (ev) => {
  const t = ev.target.closest("button");
  if (!t) return;
  if (t.dataset.j !== undefined && paso < N) {
    const p = PREGUNTAS[paso], o = opcionesDe(p)[+t.dataset.j], prev = cargarGuardado()["p" + paso];
    let marcadas = (Array.isArray(prev) ? prev : []).filter((v) => !esOtra(v));
    const ya = marcadas.indexOf(o.texto) >= 0;
    if (p.tipo === "multiple") marcadas = ya ? marcadas.filter((v) => v !== o.texto) : marcadas.concat(o.texto);
    else marcadas = ya ? [] : [o.texto];
    const orden = opcionesDe(p).map((x) => x.texto);
    marcadas.sort((a, b) => orden.indexOf(a) - orden.indexOf(b));
    guardarOpcion(paso, marcadas, $("cr-otra") ? $("cr-otra").value : "");
    pintar();
    return;
  }
  if (t.dataset.paso) { irA(paso + Number(t.dataset.paso)); return; }
  if (t.dataset.ir !== undefined) irA(Number(t.dataset.ir));
});
vista.addEventListener("input", (ev) => {
  const t = ev.target;
  if (paso >= N) return;
  if (t.id === "cr-campo") { guardar("p" + paso, t.value); if (t.tagName === "TEXTAREA") crece(t); }
  else if (t.id === "cr-otra") {
    // Escribir en «Otra» ya la marca: no hay que pulsar nada antes.
    const prev = cargarGuardado()["p" + paso];
    guardarOpcion(paso, (Array.isArray(prev) ? prev : []).filter((v) => !esOtra(v)), t.value);
    crece(t);
  } else if (t.id === "cr-rango") { $("cr-escala-valor").textContent = t.value; guardar("p" + paso, t.value); }
});
vista.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.id === "cr-campo" && ev.target.tagName === "INPUT") { ev.preventDefault(); irA(paso + 1); }
});

function generarTexto() {
  const lineas = [];
  PREGUNTAS.forEach((p, i) => {
    lineas.push("P" + (i + 1) + ". " + p.pregunta);
    lineas.push("→ " + (respuestaTexto(i) || "(sin responder)"));
    lineas.push("");
  });
  return lineas.join("\n").trim();
}

async function copiar(texto) {
  try { await navigator.clipboard.writeText(texto); return true; } catch { return false; }
}
const panelResultado = $("cr-resultado");
const cajaTexto = $("cr-texto");
const estado = $("cr-estado");
async function generarYCopiar() {
  const texto = generarTexto();
  cajaTexto.value = texto;
  panelResultado.hidden = false;
  if (await copiar(texto)) {
    estado.textContent = "Copiado. Pégalo en el chat.";
    estado.style.color = "var(--ok)";
  } else {
    cajaTexto.focus();
    cajaTexto.select();
    estado.textContent = "No se pudo copiar solo: está seleccionado, pulsa Ctrl+C.";
    estado.style.color = "var(--warn)";
  }
}
$("cr-boton").addEventListener("click", generarYCopiar);
$("cr-copiar-otra-vez").addEventListener("click", generarYCopiar);
$("cr-cerrar-resultado").addEventListener("click", () => { panelResultado.hidden = true; });
pintar();
</script>
</body>
</html>
